[project]
name = "frost-edge-system"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "PushkarOM", email = "pushkarchaturvedi42@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
frost-edge-system = "frost_edge_system:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PIE", "BLE"]
